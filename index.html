<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облако слов для урока</title>
    <!-- Библиотека QR-кодов -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Подключаем Firebase (База данных в реальном времени) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #e0f2fe; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Экран учителя */
        .teacher-container { width: 95vw; height: 90vh; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .header { padding: 15px 25px; background: #0284c7; color: white; display: flex; justify-content: space-between; align-items: center; }
        .main-content { flex: 1; display: flex; position: relative; }
        #cloud-canvas { flex: 1; background: radial-gradient(circle, #f0f9ff 0%, #e0f2fe 100%); }
        
        .qr-panel { width: 320px; background: #f8fafc; border-left: 2px solid #e2e8f0; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #qrcode { padding: 10px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        /* Экран ученика */
        .student-container { width: 100%; max-width: 480px; padding: 30px 20px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .student-container h2 { color: #0284c7; margin-bottom: 10px; }
        .input-group { margin: 20px 0; display: flex; flex-direction: column; gap: 15px; }
        .input-group input { width: 100%; padding: 14px; border: 2px solid #38bdf8; border-radius: 10px; font-size: 18px; outline: none; text-align: center; }
        .btn { padding: 14px 20px; background: #0284c7; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #0369a1; }
        
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 15px; }
        .tag-pill { background: #f0f9ff; border: 1px solid #bae6fd; color: #0284c7; padding: 6px 12px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        .tag-pill:hover { background: #e0f2fe; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- РЕЖИМ УЧИТЕЛЯ (Большой экран) -->
    <div id="teacher-view" class="teacher-container hidden">
        <div class="header">
            <h2>Рефлексия: Облако слов</h2>
            <div>
                <button class="btn" onclick="addDemoWord()" style="padding: 8px 15px; font-size: 14px; margin-right: 10px;">+ Тест слово</button>
                <button class="btn" onclick="clearCloud()" style="padding: 8px 15px; font-size: 14px; background: #ef4444;">Очистить</button>
            </div>
        </div>
        <div class="main-content">
            <canvas id="cloud-canvas"></canvas>
            <div class="qr-panel">
                <h3>Вход для учеников</h3>
                <p style="font-size: 13px; color: #64748b; text-align: center;">Отсканируйте QR-код камерной смартфона:</p>
                <div id="qrcode"></div>
                <p style="font-size: 11px; color: #94a3b8; text-align: center; word-break: break-all;" id="current-url-text"></p>
            </div>
        </div>
    </div>

    <!-- РЕЖИМ УЧЕНИКА (Смартфон) -->
    <div id="student-view" class="student-container hidden">
        <h2>Рефлексия урока</h2>
        <p style="color: #64748b; margin-bottom: 20px;">Какое слово лучше всего описывает ваше состояние или итог урока?</p>
        
        <div class="tags-container">
            <span class="tag-pill" onclick="selectTag(this)">Интересно</span>
            <span class="tag-pill" onclick="selectTag(this)">Понятно</span>
            <span class="tag-pill" onclick="selectTag(this)">Сложно</span>
            <span class="tag-pill" onclick="selectTag(this)">Супер</span>
            <span class="tag-pill" onclick="selectTag(this)">Полезно</span>
        </div>

        <div class="input-group">
            <input type="text" id="student-word" placeholder="Ваше слово..." maxlength="20" autocomplete="off">
            <button class="btn" onclick="sendWord()">Отправить слово 🚀</button>
        </div>
        <div id="success-msg" style="color: #16a34a; font-weight: bold; display: none; margin-top: 10px;">Слово успешно отправлено на экран! ✨</div>
    </div>

    <script>
        // БЕСПЛАТНАЯ ОБЩАЯ БАЗА ДАННЫХ ДЛЯ ВАШЕГО ПРИЛОЖЕНИЯ
        const firebaseConfig = {
            databaseURL: "https://wordcloud-lesson-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const isStudent = urlParams.get('role') === 'student';
        
        let wordsMap = {};

        // Разделение экранов: если в ссылке есть ?role=student, показываем ТОЛЬКО ученика
        if (isStudent) {
            document.getElementById('student-view').classList.remove('hidden');
        } else {
            document.getElementById('teacher-view').classList.remove('hidden');
            initTeacherView();
        }

        // --- ЛОГИКА УЧИТЕЛЯ ---
        function initTeacherView() {
            const canvas = document.getElementById('cloud-canvas');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            // Формируем правильную ссылку для ученика с хвостиком ?role=student
            let studentUrl = window.location.href.split('?')[0] + '?role=student';
            document.getElementById('current-url-text').innerText = studentUrl;
            
            new QRCode(document.getElementById("qrcode"), {
                text: studentUrl,
                width: 190,
                height: 190
            });

            // Слушаем базу данных в реальном времени
            db.ref('words').on('value', (snapshot) => {
                const data = snapshot.val() || {};
                wordsMap = {};
                // Считаем количество повторений каждого слова
                Object.values(data).forEach(item => {
                    if (item.word) {
                        const cleanWord = item.word.trim();
                        wordsMap[cleanWord] = (wordsMap[cleanWord] || 0) + 1;
                    }
                });
                drawCloud();
            });
        }

        function drawCloud() {
            const canvas = document.getElementById('cloud-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Рисуем контур облака
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 130, 0, Math.PI * 2);
            ctx.arc(centerX - 110, centerY + 20, 90, 0, Math.PI * 2);
            ctx.arc(centerX + 110, centerY + 20, 90, 0, Math.PI * 2);
            ctx.arc(centerX - 60, centerY - 70, 100, 0, Math.PI * 2);
            ctx.arc(centerX + 60, centerY - 70, 100, 0, Math.PI * 2);
            ctx.fill();

            // Рисуем слова внутри облака спиралью
            let index = 0;
            const colors = ['#0284c7', '#0369a1', '#0ea5e9', '#38bdf8', '#0369a1', '#2563eb'];
            
            for (let word in wordsMap) {
                const count = wordsMap[word];
                const fontSize = Math.min(16 + count * 10, 52); // Чем чаще пишут, тем крупнее
                
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.fillStyle = colors[index % colors.length];
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Распределение по спирали
                const angle = index * 0.8;
                const radius = index * 12;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;

                ctx.fillText(word, x, y);
                index++;
            }
        }

        function addDemoWord() {
            const demoWords = ['Понятно', 'Интересно', 'Сложно', 'Супер', 'Полезно', 'Круто'];
            const randomWord = demoWords[Math.floor(Math.random() * demoWords.length)];
            db.ref('words').push({ word: randomWord });
        }

        function clearCloud() {
            if (confirm('Очистить все слова на экране?')) {
                db.ref('words').remove();
            }
        }

        // --- ЛОГИКА УЧЕНИКА ---
        function selectTag(element) {
            document.getElementById('student-word').value = element.innerText;
        }

        function sendWord() {
            const input = document.getElementById('student-word');
            const word = input.value.trim();
            if (word) {
                // Отправляем слово в общую базу данных
                db.ref('words').push({ word: word }).then(() => {
                    const msg = document.getElementById('success-msg');
                    msg.style.display = 'block';
                    input.value = '';
                    setTimeout(() => {
                        msg.style.display = 'none';
                    }, 3000);
                });
            }
        }
    </script>
</body>
</html>
